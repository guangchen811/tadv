[tool.poetry]
name = "tadv"
version = "0.0.9"
description = ""
authors = ["Hao Chen <hao.chen@tu-berlin.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
langchain = "^0.3.2"
dspy-ai = "^2.5.3"
pydeequ = "^1.4.0"
ipython = "^9.0.0"
pyspark = "^3.5.3"
langchain-openai = "^0.3.11"
pyyaml = "^6.0.2"
nbconvert = "^7.16.4"
scikit-learn = "^1.5.2"
oyaml = "^1.0"
matplotlib = "^3.9.2"
duckdb = "^1.1.3"
flask = "^3.1.0"
kaggle = "^1.6.17"
seaborn = "^0.13.2"
langchain-huggingface = "^0.1.2"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
